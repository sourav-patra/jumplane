name: publish
# Uploads to PyPI through Trusted Publishing when a GitHub release is published.
# No API token is stored: PyPI accepts a short-lived OIDC token for this workflow and environment only.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/jumplane
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: test
        run: PYTHONPATH=src python -m unittest discover -s tests -t .
      - name: version matches tag
        run: |
          v=$(PYTHONPATH=src python -c "import jumplane; print(jumplane.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - name: build
        run: python -m pip install build==1.6.1 && python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
